<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика руками</title>
<meta name="description" content="Коллекция интерактивных примеров по математике.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
  /* Layout: заголовок, строка поиска и фильтров по темам, затем сетка карточек, сгруппированная по темам */
  :root {
    --bg: #eceff3; --surface: #ffffff; --fg: #1b2230; --muted: #5d6878; --line: #d3d9e2; --accent: #2f5fcf;
    --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151b; --surface: #1a2029; --fg: #e5e9ef; --muted: #98a3b3; --line: #2c3442; --accent: #7ea2ff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
         padding-inline: 16px; padding-block: 32px 48px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 6px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 4vw, 36px); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tools input {
    flex: 1 1 240px; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--surface); color: var(--fg); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  h2 a { color: var(--accent); text-decoration: none; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; margin-left: 10px; }
  h2 a:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--surface); color: inherit; text-decoration: none; min-width: 0; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Математика руками</h1>
    <p>Интерактивные модели к урокам: их можно вращать, раздвигать и пересчитывать. Каждую можно открыть на доске или отправить ссылкой.</p>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="Поиск: объём, пирамида, вероятность…" aria-label="Поиск по примерам">
    <div class="chips" id="chips" role="group" aria-label="Темы"></div>
  </div>

  <main id="list"><p class="empty">Загружаю каталог…</p></main>

  <footer>Исходники: <a href="https://github.com/ivanblinov2k17/math-demos">github.com/ivanblinov2k17/math-demos</a></footer>
</div>

<script>
const listEl = document.getElementById("list");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");
let items = [], topic = "Все";

// У некоторых тем есть своя общая страница раздела
const SECTIONS = { "Фракталы": "fractals/" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const q = qEl.value.trim().toLowerCase();
  const shown = items.filter(it =>
    (topic === "Все" || it.topic === topic) &&
    (!q || [it.title, it.summary, it.topic, ...(it.tags || [])].join(" ").toLowerCase().includes(q)));
  if (!shown.length) { listEl.innerHTML = '<p class="empty">Ничего не нашлось. Попробуйте другой запрос или тему.</p>'; return; }
  const groups = {};
  shown.forEach(it => (groups[it.topic] ||= []).push(it));
  listEl.innerHTML = Object.entries(groups).map(([t, arr]) => `
    <section>
      <h2>${esc(t)} · ${arr.length}${SECTIONS[t] ? `<a href="${SECTIONS[t]}">Открыть раздел →</a>` : ""}</h2>
      <div class="grid">${arr.map(it => `
        <a class="card" href="${esc(it.path)}">
          <h3>${esc(it.title)}</h3>
          <p>${esc(it.summary)}</p>
          <div class="meta">${it.grade ? `<span>${esc(it.grade)} кл.</span>` : ""}${(it.tags || []).map(x => `<span>#${esc(x)}</span>`).join("")}</div>
        </a>`).join("")}
      </div>
    </section>`).join("");
}

function renderChips() {
  const topics = ["Все", ...new Set(items.map(i => i.topic))];
  chipsEl.innerHTML = topics.map(t => `<button type="button" class="chip" aria-pressed="${t === topic}">${esc(t)}</button>`).join("");
  chipsEl.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => { topic = topics[i]; renderChips(); render(); }));
}

fetch("catalog.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => { items = data.sort((a, b) => (b.added || "").localeCompare(a.added || "")); renderChips(); render(); })
  .catch(() => { listEl.innerHTML = '<p class="empty">Не удалось загрузить каталог. Откройте страницу через сайт, а не как локальный файл.</p>'; });
qEl.addEventListener("input", render);
</script>
</body>
</html>
